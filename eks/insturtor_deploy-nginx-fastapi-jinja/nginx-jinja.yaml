apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
spec:
  # replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx-lb
  # 아래 부터 파드에 대한 설정
  template:
    metadata:
      labels:
        app: nginx-lb
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.31.3-alpine
          ports:
            - containerPort: 80
          volumeMounts:
          - name: nginx-vol          # ConfigMap 마운트를 위한 볼륨 이름
            mountPath: /etc/nginx/conf.d/default.conf   # 컨테이너 내부 경로 및 파일명까지 기재
            subPath: default.conf     # ConfigMap의 특정 키(파일명)를 지정
          - name: nginx-vol   
            mountPath: /usr/share/nginx/html/index.html # 컨테이너 내부 경로 및 파일명까지 기재
            subPath: index.html       # ConfigMap의 특정 키(파일명)를 지정
        
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          # env:
          # - name: NGINX_PORT
          #   value: "80"
          livenessProbe:
            httpGet:
              path: /       # nginx의 특성상 헬스체크 경로는 루트로 재 정의
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /       # nginx의 특성상 헬스체크 경로는 루트로 재 정의
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: nginx-vol
          configMap:  # ConfigMap을 볼륨의 소스로 지정
            name: nginx-configmap  # ConfigMap 이름 지정
---
# HPA(Horizontal Pod Autoscaler)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deploy  # <워커로드 이름> 여기선 Deployment_name
  minReplicas: 1        # <파드의 최소 유지 갯수>
  maxReplicas: 3        # <파드의 최대 갯수>
  metrics:
    - type: Resource  # resource(파드의 cpu or memory), Pods(초당 요청수, 응답 지연 시간), 
                      # Object(Ingress-ALB 로 유입되는 트래픽의 양), External(AWS SQS 서비스 큐 메시지 갯수)
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80 # %

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deploy
spec:
  # replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fastapi-lb
  # 아래 부터 파드에 대한 설정
  template:
    metadata:
      labels:
        app: fastapi-lb
    spec:
      containers:
        - name: fastapi-container
          image: 925047940866.dkr.ecr.ap-south-1.amazonaws.com/bipa17-instructor/fastapi:kubernetes-v1
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "600m"
          # env:
          # - name: NGINX_PORT
          #   value: "80"
          livenessProbe:
            httpGet:
              path: /db-check       # nginx의 특성상 헬스체크 경로는 루트로 재 정의
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /db-check       # nginx의 특성상 헬스체크 경로는 루트로 재 정의
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# HPA(Horizontal Pod Autoscaler)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fastapi-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fastapi-deploy  # <워커로드 이름> 여기선 Deployment_name
  minReplicas: 2        # <파드의 최소 유지 갯수>
  maxReplicas: 6        # <파드의 최대 갯수>
  metrics:
    - type: Resource  # resource(파드의 cpu or memory), Pods(초당 요청수, 응답 지연 시간), 
                      # Object(Ingress-ALB 로 유입되는 트래픽의 양), External(AWS SQS 서비스 큐 메시지 갯수)
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80 # %
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  type: LoadBalancer    # 외부 접속을 위한 로드밸런서 정의(CLB)
  selector:
    app: nginx-lb
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-svc
spec:
  type: ClusterIP    # 외부 접속을 위한 로드밸런서 정의(CLB)
  selector:
    app: fastapi-lb
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000












