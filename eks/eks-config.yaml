apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:   # eks 자체 설정
    name: std09-ex1-cluster
    region: ca-central-1
    tags:
        # Name: "std09-ex-cluster"
        Project: "Education"
        Owner: "bipa17"
iam:
    withOIDC: true    # eks에 생성된 인스턴스들이 AWS 서비스를 사용할 수 있게 함.
vpc:
    id: "vpc-0e599640b22e89a0f"
    clusterEndpoints:
        publicAccess: true
        privateAccess: true
    subnets:
        public:
            ca-central-1a:
                id: subnet-0e4e94ba6d2c7d7f8 # 기존의 VPC에 있는 서브넷을 그대로 사용
                tags:
                  kubernetes.io/cluster/ian-ex-cluster: "shared"
                  kubernetes.io/role/elb: "1"
            ca-central-1b:
                id: subnet-06c09231e1e87ef4b
                tags:
                  kubernetes.io/cluster/ian-ex-cluster: "shared"
                  kubernetes.io/role/elb: "1"
            ca-central-1d:
                id: subnet-0719fd5c2c9232928
                tags:
                  kubernetes.io/cluster/ian-ex-cluster: "shared"
                  kubernetes.io/role/elb: "1"
            ca-central-1a:
                id: subnet-0a1084b68378a36e1
                tags:
                  kubernetes.io/cluster/ian-ex-cluster: "shared"
                  kubernetes.io/role/internal-elb: "1"
            ca-central-1b:
                id: subnet-0984309a6289f0694
                tags:
                  kubernetes.io/cluster/ian-ex-cluster: "shared"
                  kubernetes.io/role/internal-elb: "1"
            ca-central-1d:
                id: subnet-0499df80696d3e0fb
                tags:
                  kubernetes.io/cluster/ian-ex-cluster: "shared"
                  kubernetes.io/role/internal-elb: "1"

# 노드그룹 이름, 타입, 개수, 볼륨, AMI(eks 지원하는), ssh 설정, 어디(public/private) 배치할지
# 보안그룹, 정책(IAM)
managedNodeGroups:
  - name: std09-ex-eks-ng
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    # 사용할 AMI 종류: eks가 지원되는 AmazonLinux2023, Ubuntu 등
    amiFamily: AmazonLinux2023
    ami: "ami-02cb4c5977b6a5f87"   # 사용할 ami의 ID
    privateNetworking: true     # 인스턴스를 프라이빗 서브넷에만 배포
    ssh:
        allow: true
        publicKeyName: "std09-keypair" # EC2 키페어 이름
    securityGroups:
        attachIDs: ["sg-0a6953e10a2ef4c6c", "sg-0fbff56eb32675f56"] # ssh, 외부 ALB를 통해 접근 to svc-sg
    # 테인트 설정: 데이터베이스 전용 Pod 외의 일반 Pod 배포를 차단(NoSchedule)
    # taints:
    #   - key: "dedicated" 키(key): 노드의 용도를 식별하기 위한 고유 이름 (예: dedicated=database)
    #     value: "database" 값(value): 테인트의 세부 분류 값 (여기서는 데이터베이스  지정)
    #     effect: "NoSchedule" 효과(Effect): 툴러레이션(Toleration)이 없는 Pod는 해당 노드에 스케줄링(배포)하지 않음
    
    iam:
        withAddonPolicies:
            imageBuilder: true  # 컨테이너 이미지 사용 권한
            autoScaler: true    # 오토스케일그룹 사용 권한
            albIngress: true    # 로드밸런서 사용 권한 정책
            cloudWatch: true    # 로그 허용을 통한 모니터링 허용 정책

addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: aws-ebs-csi-driver
    version: latest
    resolveConflicts: overwrite
  - name: aws-efs-csi-driver
    version: latest
    resolveConflicts: overwrite
  - name: aws-mountpoint-s3-csi-driver
    version: latest
    resolveConflicts: overwrite


# 생성 명령: eksctl create cluster -f [파일명.yaml]
# 에러 발생시 혹은 그냥 삭제하고싶을때
# eksctl delete cluster -f <파일명.yaml>