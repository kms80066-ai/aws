apiVersion: v1
kind: PersistentVolume
metadata:
  name: my-pv1
spec: 
  capacity:
    storage: 1Gi
  accessModes:  # ReadWriteOnce, ReadOnlyMany, ReadWriteMany
  - ReadWriteOnce
  hostPath:
    path: /var/www/html1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: my-pv2
spec: 
  capacity:
    storage: 2Gi
  accessModes:  # ReadWriteOnce, ReadOnlyMany, ReadWriteMany
  - ReadOnlyMany
  hostPath:
    path: /var/www/html2

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-pvc1
spec:
  accessModes:
  - ReadOnlyMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: my-nginx-pod
  labels:
    app: my-nginx
spec:
  containers:
  - name: my-nginx-container
    image: nginx:1.31.3-alpine
    volumeMounts:
    - name: my-pvc-volume
      mountPath: /usr/share/nginx/html
  volumes:
  - name: my-pvc-volume
    persistentVolumeClaim:
      claimName: my-pvc1