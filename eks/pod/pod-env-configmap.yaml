# kubectl apply -f - <<EOF
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-app-config     # 이 이름은 POD의 env에서 사용할
  labels:
data:
  APP_MODE: "production"  # key명, 가져오는 것은 "production"
  SERVER_PORT: "8080"

---   # 파일과 파일의 구분은 ---로 한다.
apiVersion: v1    # kubectl api-resources에 나오는 버전 값
kind: Pod
metadata:
  name: configmap-demo-pod  # 파드의 이름 정의
  labels: 
    app: web
spec:
  containers:
    - name: app-container
      image: busybox:latest
      command: ["/bin/sh","-c","env; sleep 120"]
      env:
        - name: MODE
          valueFrom:
            configMapKeyRef:
              name: my-app-config   # 참조할 ConfigMap 이름
              key: APP_MODE         # 가져올 데이터의 키 이름
# EOF