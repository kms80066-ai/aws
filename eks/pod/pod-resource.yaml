apiVersion: v1    # kubectl api-resources에 나오는 버전 값
kind: Pod
metadata:
  name: my-pod  # 파드의 이름 정의
  labels:
    app: web
spec:
  containers:
    - name: my-nginx-pod
      image: nginx:latest
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"   # Limits > Requests(Burstable 판정)
