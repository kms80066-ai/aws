# 노드그룹 이름, 타입, 개수, 볼륨, AMI(eks 지원하는), ssh 설정, 어디(public/private) 배치할지
# 보안그룹, 정책(IAM)
managedNodeGroups:
  - name: std09-ex-eks-ng
    instanceType: t3.micro
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    privateNetworking: true     # 인스턴스를 프라이빗 서브넷에만 배포
    ssh:
        allow: true
        publicKeyName: "std09-keypair" # EC2 키페어 이름
    # securityGroups:
    #     attachIDs: [""]
    iam:
        withAddonPolicies:
            imageBuilder: true  # 컨테이너 이미지 사용 권한
            autoScaler: true    # 오토스케일그룹 사용 권한
            albIngress: true    # 로드밸런서 사용 권한 정책
            cloudWatch: true    # 로그 허용을 통한 모니터링 허용 정책

# 생성 명령: eksctl create cluster -f [파일명.yaml]
