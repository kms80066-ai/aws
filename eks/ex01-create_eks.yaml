        Project: "Education"
        Owner: "bipa17"
# iam:
#     withOIDC: true    # eks에 생성된 인스턴스들이 AWS 서비스를 사용할 수 있게 함.
vpc:
    # cidr: "10.0.0.0/16"
    # enableDnsHostname: true
    # enableDnsSupport: true
    clusterEndpoints:
        publicAccess: true
        privateAccess: true
    nat:
        gateway: Single
