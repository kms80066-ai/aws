# 앞서만든 practice-nginx-fastapi와 ingress를 합쳤다.
# 경로 수정을 한 것이 있어 알아놔야 한다.
# 보안그룹도 수정해줬다.
# 이 상태에서는 도메인/nginx 와 도메인/api가 작동한다 /api/docs, /api/healthz, /api/db-check

# FastAPI 코드 & HTML (fastapi-code-config):
# FastAPI 앱 생성 시 root_path="/api"를 지정하여 /api 하위 경로를 인식하도록 구성했습니다.
# 템플릿의 돌아가기 링크를 / 대신 /nginx로 변경했습니다.

# Nginx 웹페이지 (nginx-index-html-configmap):
# Jinja 대시보드로 이동하는 버튼의 링크를 /jinja에서 /api/로 변경했습니다.  

# Nginx 설정 (nginx-conf-config):

# ALB Ingress가 /api 트래픽을 직접 FastAPI로 분기하므로 Nginx 내부의
#  location /jinja/ 프록시 설정을 제거하고 순수 정적 파일 서빙만 남겼습니다.

# Service Type (nginx-service):

# 불필요한 클래식 로드밸런서 생성을 막기 위해 type: LoadBalancer에서 type: ClusterIP로 변경했습니다.

# Ingress 경로 변환 (transforms.nginx-service):

# /nginx로 들어온 요청에서 접두사를 제거하고 Nginx 컨테이너의 루트(/)로 전달하도록 유지했습니다

# ==========================================
# 1. FastAPI ConfigMap (코드 & 템플릿)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-code-config
data:
  main.py: |
    from fastapi import FastAPI, Request, HTTPException
    from fastapi.responses import HTMLResponse
    from fastapi.templating import Jinja2Templates
    import pymysql
    import os

    # Ingress /api 경로에 맞추어 root_path 지정
    app = FastAPI(root_path="/api")
    templates = Jinja2Templates(directory="/app/templates")

    DB_CONFIG = {
        "host": "db-mysql.cd6e4was8qr6.ca-central-1.rds.amazonaws.com",
        "user": "std09",
        "password": "qwerasdf",
        "database": "testdb",
        "port": 3306,
        "charset": "utf8mb4"
    }

    @app.get("/healthz")
    def health_check():
        return {"status": "ok"}

    @app.get("/", response_class=HTMLResponse)
    async def read_root(request: Request):
        try:
            k8s_data = {
                "title": "Kubernetes Navigation",
                "subtitle": "컨테이너 오케스트레이션의 바다를 항해하다",
                "sections": [
                    {"id": "arch", "title": "Cluster Architecture", "desc": "Control Plane & Worker Node"},
                    {"id": "object", "title": "K8s Objects", "desc": "Pod, Service, Deployment"},
                    {"id": "network", "title": "Networking", "desc": "Ingress & Service Mesh"},
                    {"id": "storage", "title": "Storage & PV", "desc": "Persistent Volumes"}
                ]
            }
            return templates.TemplateResponse(
                request=request,
                name="index.html",
                context={"data": k8s_data}
            )
        except Exception as e:
            return HTMLResponse(content=f"<h1>Template Render Error</h1><p>{str(e)}</p>", status_code=500)

    @app.get("/db-check")
    def check_db_connection():
        try:
            connection = pymysql.connect(**DB_CONFIG)
            connection.close()
            return {"status": "connected"}
        except Exception as e:
            raise HTTPException(status_code=500, detail=f"Database connection failed: {str(e)}")

  jinja_index.html: |
    <!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>{{ data.title }}</title>
        <style>
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #eef2f3; padding: 30px; text-align: center; }
            .card { background: white; margin: 15px auto; padding: 20px; max-width: 600px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
            a { display: inline-block; margin-top: 20px; text-decoration: none; color: #2980b9; font-weight: bold; }
        </style>
    </head>
    <body>
        <h1>{{ data.title }}</h1>
        <p>{{ data.subtitle }}</p>
        {% for sec in data.sections %}
        <div class="card">
            <h3>{{ sec.title }}</h3>
            <p>{{ sec.desc }}</p>
        </div>
        {% endfor %}
        <!-- Ingress의 Nginx 경로(/nginx)로 이동하도록 수정 -->
        <a href="/nginx">⬅ 메인 음악 페이지로 돌아가기</a>
    </body>
    </html>
---
# ==========================================
# 2. FastAPI Deployment, HPA & Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      containers:
      - name: fastapi-container
        image: python:3.10-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install fastapi uvicorn jinja2 pymysql
            cd /app
            exec uvicorn main:app --host 0.0.0.0 --port 8000
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 35
          periodSeconds: 5
        volumeMounts:
        - name: app-code
          mountPath: /app/main.py
          subPath: main.py
        - name: app-code
          mountPath: /app/templates/index.html
          subPath: jinja_index.html
      volumes:
      - name: app-code
        configMap:
          name: fastapi-code-config
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fastapi-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fastapi-deployment
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
spec:
  type: ClusterIP
  selector:
    app: fastapi-app
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
---
