# 1. StorageClass 정의: 어떤 드라이버의 어떤 파일시스템을 사용할지
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com  # 사용할 드라이버

---
# 2. PV 정의
apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-08098383476e603d4  # 사용할 EFS ID 입력

---
# 3. PVC 정의
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-pvc
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 5Gi
  volumeName: efs-pv

---
# 4. EFS 마운트 테스트 Pod
apiVersion: v1
kind: Pod
metadata:
  name: efs-test-pod
spec:
  containers:
  - name: efs-test-container
    image: busybox
    command: ["/bin/sh"]
    args: ["-c","sleep 3600"]
    volumeMounts:
    - name: efs-storage
      mountPath: /data
  volumes:
  - name: efs-storage
    persistentVolumeClaim:
      claimName: efs-pvc
