# 1. nginx 파드 최소 2개 최대 6
# 2. 로드밸런서로 외부 접속이 가능해야함, 도메인연결
# 3. ConfigMap을 이용한 index.html 파일 변경
# 4. ConfigMap을 이용한 nginx의 환경설정 파일 default.conf 변경
# 5. fastAPI는 jinja2로 구성된 페이지 로드: http://www.kms26.cloud/jinja
# 6. fastaPI 최소2 최대6
# 7. index.html에서 특정 버튼(링크)을 클릭하면 fastAPI의 jinja2페이지가 뜨도록 구성
# 8. RDS로 MySQL 생성해 엔드포인트를 main.py에 넣어 db 연결 확인 할 수 있게. 이때 main.py내 사용자명, 비밀번호, 데이터베이스 이름이 MySQL에 적용돼있어야한다.

# 1. FastAPI 파이썬 코드 및 템플릿용 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-code-config
data:
  main.py: |
    from fastapi import FastAPI, Request, HTTPException
    from fastapi.responses import HTMLResponse
    from fastapi.templating import Jinja2Templates
    import pymysql
    import os

    app = FastAPI()
    # 템플릿 디렉토리 경로 지정
    templates = Jinja2Templates(directory="/app/templates")

    # DB 서비스 이름 확인 (실제 존재하는 Service 이름으로 설정)
    DB_CONFIG = {
        "host": "db-mysql.cd6e4was8qr6.ca-central-1.rds.amazonaws.com",
        "user": "std09",
        "password": "qwerasdf",
        "database": "testdb",
        "port": 3306,
        "charset": "utf8mb4"
    }

    @app.get("/healthz")
    def health_check():
        return {"status": "ok"}

    @app.get("/", response_class=HTMLResponse)
    async def read_root(request: Request):
        try:
            k8s_data = {
                "title": "Kubernetes Navigation",
                "subtitle": "컨테이너 오케스트레이션의 바다를 항해하다",
                "sections": [
                    {"id": "arch", "title": "Cluster Architecture", "desc": "Control Plane & Worker Node"},
                    {"id": "object", "title": "K8s Objects", "desc": "Pod, Service, Deployment"},
                    {"id": "network", "title": "Networking", "desc": "Ingress & Service Mesh"},
                    {"id": "storage", "title": "Storage & PV", "desc": "Persistent Volumes"}
                ]
            }
            return templates.TemplateResponse(
                request=request,
                name="index.html",
               context={"data": k8s_data}
            )
        except Exception as e:
            return HTMLResponse(content=f"<h1>Template Render Error</h1><p>{str(e)}</p>", status_code=500)

    @app.get("/db-check")
    def check_db_connection():
        try:
            connection = pymysql.connect(**DB_CONFIG)
            connection.close()
            return {"status": "connected"}
        except Exception as e:
            raise HTTPException(status_code=500, detail=f"Database connection failed: {str(e)}")

  jinja_index.html: |
    <!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>{{ data.title }}</title>
        <style>
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #eef2f3; padding: 30px; text-align: center; }
            .card { background: white; margin: 15px auto; padding: 20px; max-width: 600px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
            a { display: inline-block; margin-top: 20px; text-decoration: none; color: #2980b9; font-weight: bold; }
        </style>
    </head>
    <body>
        <h1>{{ data.title }}</h1>
        <p>{{ data.subtitle }}</p>
        {% for sec in data.sections %}
        <div class="card">
            <h3>{{ sec.title }}</h3>
            <p>{{ sec.desc }}</p>
        </div>
        {% endfor %}
        <a href="/">⬅ 메인 음악 페이지로 돌아가기</a>
    </body>
    </html>
---
# ==========================================
# 3. FastAPI Deployment & Service (요구사항 5, 6)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      containers:
      - name: fastapi-container
        image: python:3.10-slim   # Docker Hub 공식 파이썬 기본 이미지
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install fastapi uvicorn jinja2 pymysql
            cd /app
            exec uvicorn main:app --host 0.0.0.0 --port 8000
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 35
          periodSeconds: 5
        volumeMounts:
        - name: app-code
          mountPath: /app/main.py
          subPath: main.py
        - name: app-code
          mountPath: /app/templates/index.html
          subPath: jinja_index.html
      volumes:
      - name: app-code
        configMap:
          name: fastapi-code-config
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fastapi-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fastapi-deployment
  minReplicas: 2   # 요구사항 6: 최소 2개
  maxReplicas: 6   # 요구사항 6: 최대 6개
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
spec:
  type: ClusterIP
  selector:
    app: fastapi-app
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
---

