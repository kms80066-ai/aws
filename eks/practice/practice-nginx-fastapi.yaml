# ==========================================
# 2. ConfigMap: Nginx 설정 default.conf (요구사항 4, 5)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf-config
data:
  default.conf: |
    charset utf-8;

    server {
        listen 80;
        server_name www.kms26.cloud kms26.cloud _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # 1. 프론트엔드 정적 서빙
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # 2. FastAPI Jinja2 페이지 프록시 연결 (/jinja 요청 전달)
        location /jinja/ {
            proxy_pass http://fastapi-service:8000/;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  # replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1           # 업데이트 중 replicas 보다 최대 몇개 더 파드를 초과 생성할 수 있는지
      maxUnavailable: 0      # 동시에 내릴 파드의 개수(0으로 놓으면 무중단 배포가 가능하게 됨)
  selector:
    matchLabels:
      app: nginx-web
  # 아래부터 파드에 대한 설정
  template:
    metadata:
      labels:
        app: nginx-web
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.31.3-alpine
        ports:
        - containerPort: 80
        resources:
          requests:                   #최소 리소스
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"           #최대 리소스
            cpu: "500m"   # Limits > Requests(Burstable 판정)
        env:
        - name: NGINX_PORT
          value: "80"
        livenessProbe:                    # 컨테이너 사용 가능 유무를 지속적으로 확인
          httpGet:
            path: /                       # 헬스 체크를 위해 요청을 보낼 HTTP URL 경로(루트 경로)
            port: 80                      # 헬스 체크 요청을 보낼 컨테이너의 포트 번호
          initialDelaySeconds: 30         # 컨테이너가 시작된 후 첫번째 Liveness 검사를 수행하기 전까지 대기하는 시간(초)
          periodSeconds: 10               # 헬스 체크를 수행하는 주기
        readinessProbe:                   # 사용할 준비가 되었는지 확인
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        # ConfigMap으로 index.html 덮어쓰기
        - name: nginx-html-volume
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        # ConfigMap으로 default.conf 덮어쓰기
        - name: nginx-conf-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        #  추가: 컨테이너 내부 images 경로로 마운트
        - name: nginx-images-volume
          mountPath: /usr/share/nginx/html/images
      volumes:
      - name: nginx-html-volume
        configMap:
          name: nginx-index-html-configmap
      - name: nginx-conf-volume
        configMap:
          name: nginx-conf-config
        #  추가: 워커 노드의 로컬 디렉토리 연결
      - name: nginx-images-volume
        hostPath:
          path: /var/www/images
          type: DirectoryOrCreate
---
# HPA(Horizontal Pod Autoscaler)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deployment  # <워크로드 이름> = 파드 관리자 = 여기서는 deployment의 이름
  minReplicas: 2  # <파드 최소 유지 개수>
  maxReplicas: 6  # <파드 최대 개수>
  metrics:
  - type: Resource  # resource(파드의 cpu or memory), Pods(초당 요청수, 응답 지연 시간),    무엇을 (기준)으로 pod을 늘리고 줄일 것이냐
                    # Object(Ingress-ALB로 유입되는 트래픽의 양), External(AWS SQS 서비스 큐 메시지)
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80  # %
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: LoadBalancer    # 외부 접속을 위한 로드밸런서 정의, 클래식
  selector:
    app: nginx-web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80


