<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS & DB 퀴즈 - kms26.cloud</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        .quiz-card { background: #fafafa; border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .question { font-size: 18px; font-weight: bold; color: #34495e; margin-bottom: 15px; }
        .options { list-style: none; padding: 0; }
        .options li { margin-bottom: 10px; background: white; border: 1px solid #ddd; padding: 12px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .options li:hover { background: #eef7fc; border-color: #3498db; }
        .options label { cursor: pointer; display: block; width: 100%; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background-color: #219150; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 5px; font-size: 16px; font-weight: bold; display: none; }
        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .back-link { display: inline-block; margin-top: 25px; color: #7f8c8d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AWS & MySQL 데이터베이스 퀴즈</h1>
        <p>FastAPI와 MySQL DB 연동을 통해 동적으로 로드된 5지선다 문제입니다.</p>

        <div class="quiz-card" id="quiz-container">
            <div class="question" id="quiz-question">문제를 불러오는 중입니다...</div>
            <ul class="options" id="quiz-options"></ul>
            <button onclick="submitAnswer()">정답 제출하기</button>
        </div>

        <div id="result-box" class="result-box"></div>

        <a href="index.html" class="back-link">← 메인 페이지로 돌아가기</a>
    </div>

    <script>
        const API_URL = "https://api.kms26.cloud";
        let currentQuizId = null;

        // 페이지 로드 시 백엔드(MySQL)에서 퀴즈 데이터 가져오기
        async function loadQuiz() {
            try {
                const response = await fetch(`${API_URL}/quiz`);
                const data = await response.json();

                if (response.ok) {
                    currentQuizId = data.id;
                    document.getElementById("quiz-question").innerText = `Q. ${data.question}`;
                    
                    const optionsUl = document.getElementById("quiz-options");
                    optionsUl.innerHTML = "";

                    data.options.forEach((opt, idx) => {
                        const num = idx + 1;
                        optionsUl.innerHTML += `
                            <li>
                                <label>
                                    <input type="radio" name="option" value="${num}">
                                    ${num}. ${opt}
                                </label>
                            </li>
                        `;
                    });
                } else {
                    document.getElementById("quiz-question").innerText = "문제를 불러오지 못했습니다: " + data.detail;
                }
            } catch (err) {
                document.getElementById("quiz-question").innerText = "API 통신 에러 발생: " + err;
            }
        }

        // 정답 검증 요청
        async function submitAnswer() {
            const selected = document.querySelector('input[name="option"]:checked');
            const resultBox = document.getElementById("result-box");

            if (!selected) {
                alert("보기 중 하나를 선택해 주세요!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/quiz/submit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        quiz_id: currentQuizId,
                        selected_option: parseInt(selected.value)
                    })
                });

                const result = await response.json();
                resultBox.style.display = "block";

                if (result.is_correct) {
                    resultBox.className = "result-box correct";
                    resultBox.innerText = `🎉 정답입니다! (${result.message})`;
                } else {
                    resultBox.className = "result-box incorrect";
                    resultBox.innerText = `❌ 틀렸습니다. (선택한 답: ${selected.value}번 / ${result.message})`;
                }
            } catch (err) {
                alert("정답 제출 중 에러 발생: " + err);
            }
        }

        // 초기 화면 로드 시 실행
        window.onload = loadQuiz;
    </script>
</body>
</html>
