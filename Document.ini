# Kubernetes에서 Labels의 역할은 다음과 같다.
# - 복잡하고 다양한 Pod를 효율적인 그룹으로 묶어 사용하기 위함
# - 객체를 식별하고 그룹화하기에 효율적이다.
# - label을 통해 특정 리소스(Service)에 연결하고나 네트워크 접근 권한 등을 부여하는 작업을 할 수 있다.

# 실습-1
# 실습 설명 : 파드를 생성하고 라벨을 추가 삭제 수정해 보자
# ===========================================================================
# nginx:1.29.4-alpine 이미지를 이용하여 Pod를 생성할 때 라벨을 부여한다.
# label은 기본적으로 "key=value"의 형식을 취한다.
kubectl run pod1 --image=nginx:1.29.4-alpine --labels=key=value

# 생성된 파드의 라벨 확인 : --show-labels 옵션 사용
# kubectl get pods --show-labels 또는 kubectl get po [pod-name]--show-labels
kubectl get po --show-labels

# 파드를 생성하여 여러 개의 라벨을 부여할 수도 있다.
kubectl run pod2 --image=nginx:1.29.4-alpine --labels="key1=value1,key2=value2, key3=value3"

# 이미 실행 중인 파드에 라벨을 추가하거나 수정할 수도 있다.
# 라벨 추가
kubectl label pod pod1 env=dev
# 라벨의 이름(key)을 변경할 수는 없으나 새로운 라벨을 생성하고 기존 라벨을 삭제하는 방식으로 변경할 수 있다.
# 라벨 변경(기존 라벨 삭제 후 새로운 라벨 추가)
# 아래 명령어에 서와 같이 기존 라벨을 삭제할 때는 라벨 이름 뒤에 '-'를 붙여준다.
kubectl label pod pod1 key- key=newvalue
# 라벨의 값을 변경할 때는 라벨 이름과 새로운 값을 '='로 구분하여 지정해준다.
# 다만 값의 변경으로 인한 문제 발생을 방지하기 위해 값 변경 시에는 기존 라벨을 삭제하고 새로운 라벨을 추가하는 방식을 권장하기는 하나
# --overwrite 옵션을 사용하여 값을 직접 변경할 수도 있다.
kubectl label pod pod1 key=newvalue --overwrite


# 실습-2
# 실습 설명 : 라벨 셀렉터를 이용하여 파드를 조회해 보자
# 실습에 앞서 기존 파드를 모두 삭제한다.
kubectl delete pod pod1 pod2
# ===========================================================================
# 여러 개의 파드를 생성하면서 각 파드에 라벨을 부여한다.
kubectl run pod1 --image=nginx:1.29.4-alpine --labels="key1=value1,key2=value2"
kubectl run pod2 --image=nginx:1.29.4-alpine --labels="key2=value2,key3=value3"
kubectl run pod3 --image=nginx:1.29.4-alpine --labels="key1=value1,key3=value3"
# 특정 라벨을 가진 파드 조회
kubectl get pods --show-labels -l key1=value1
kubectl get pods --show-labels -l key1
kubectl get pods --show-labels --selector=key1=value1
kubectl get pods --show-labels --selector key1=value1
kubectl get pods --show-labels -l key1=value1,key2=value2
# 특정 라벨이 없는 파드 조회
kubectl get pods --show-labels -l '!key3'
# 특정 라벨 값이 다른 파드 조회
kubectl get pods --show-labels -l 'key1!=value1'
# and 조건과 or 조건을 혼합하여 조회
kubectl get pods  --show-labels -l 'key1=value2,key3=value3'
kubectl get pods --show-labels -l 'key2=value2' -l 'key3=value3'

# 실습-3
# 실습 설명 : 라벨을 이용하여 서비스를 생성해 보자
# 실습에 앞서 기존 파드를 모두 삭제한다.
kubectl delete pod pod1 pod2 pod3
# ===========================================================================
kubectl run pod1 --image=nginx:1.29.4-alpine --labels="app=webserver,tier=frontend"
kubectl run pod2 --image=nginx:1.29.4-alpine --labels="app=webserver,tier=backend"
kubectl run pod3 --image=nginx:1.29.4-alpine --labels="app=database,tier=backend"
# app=webserver 라벨이 부여된 파드들에 접근하는 서비스를 생성한다.
kubectl expose pod pod1 --port=80 --name=webserver-frontend --selector="app=webserver,tier=frontend"
kubectl expose pod pod2 --port=80 --name=webserver-backend --selector="app=webserver,tier=backend"
# app=database 라벨이 부여된 파드들에 접근하는 서비스를 생성한다.
kubectl expose pod pod3 --port=80 --name=database-backend --selector="app=database,tier=backend"
# 생성된 서비스 확인
kubectl get svc -o wide
# 각 서비스가 선택하는 파드 확인
kubectl get pods --show-labels -l app=webserver,tier=frontend
kubectl get pods --show-labels -l app=webserver,tier=backend
kubectl get pods --show-labels -l app=database,tier=backend
# 실습이 끝난 후 생성된 파드와 서비스를 삭제한다.
kubectl delete pod pod1 pod2 pod3
kubectl delete svc webserver-frontend webserver-backend database-backend

